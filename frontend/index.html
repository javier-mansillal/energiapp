<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Energiapp" />
    <title>Energiapp</title>
    <script>
      // Anti-flash: aplica el tema guardado antes de que React monte
      (function () {
        const key = 'energiapp-theme'
        const stored = localStorage.getItem(key)
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'light') {
          document.documentElement.classList.remove('dark')
        } else if (stored === 'dark' || prefersDark) {
          document.documentElement.classList.add('dark')
        }
        // si no hay stored y no hay prefers-dark → dark (default)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
